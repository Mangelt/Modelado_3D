services:
  mongo1:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongo2:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongo3:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: |
      set -e
      mongosh --host mongo1:27017 --quiet --eval '
        let initialized = false;
        try { initialized = rs.status().ok === 1; } catch (e) {}
        if (!initialized) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo1:27017", priority: 2 },
              { _id: 1, host: "mongo2:27017", priority: 1 },
              { _id: 2, host: "mongo3:27017", priority: 1 }
            ]
          });
        }
      '
      until mongosh --host mongo1:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
        echo "Esperando al primario rs0..."
        sleep 2
      done
      echo "Replica set rs0 listo."
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/sistemas_distribuidos_3d?replicaSet=rs0
      CLIENT_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501
      AUTH_SECRET_FILE: /app/.secrets/auth-secret
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - auth_secret:/app/.secrets
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - modelado3d-server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "5501:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  auth_secret:
