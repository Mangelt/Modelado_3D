<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="24" fill="#1e1e1e"/>
  <!-- Isometric 3D Cube -->
  <!-- Top Face -->
  <polygon points="64,26 98,45 64,64 30,45" fill="#38bdf8"/>
  <!-- Left Face -->
  <polygon points="30,45 64,64 64,102 30,83" fill="#0284c7"/>
  <!-- Right Face -->
  <polygon points="64,64 98,45 98,83 64,102" fill="#0369a1"/>
  <!-- Center Highlight / Vertices -->
  <circle cx="64" cy="26" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="98" cy="45" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="30" cy="45" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
  <circle cx="64" cy="102" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="30" cy="83" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="98" cy="83" r="3" fill="#ffffff" opacity="0.8"/>
</svg>
