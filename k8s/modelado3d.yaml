apiVersion: v1
kind: Namespace
metadata:
  name: modelado3d
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modelado3d-config
  namespace: modelado3d
data:
  PORT: "8080"
  MONGO_URI: "mongodb://mongo-0.mongo.modelado3d.svc.cluster.local:27017,mongo-1.mongo.modelado3d.svc.cluster.local:27017,mongo-2.mongo.modelado3d.svc.cluster.local:27017/sistemas_distribuidos_3d?replicaSet=rs0"
  CLIENT_ORIGINS: "http://localhost:5501,http://127.0.0.1:5501"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modelado3d-nginx
  namespace: modelado3d
data:
  default.conf: |
    # Kubernetes usa DNS del clúster y un Service con ClusterIP estable.
    # No usar 127.0.0.11 (DNS embebido de Docker Compose) dentro de Pods.
    upstream modelado3d_backend {
        server modelado3d-server:8080;
        keepalive 32;
    }
    
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
    
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    
        location /api/ {
            proxy_pass http://modelado3d_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    
        location = /ws {
            proxy_pass http://modelado3d_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Origin $http_origin;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    
        location / {
            try_files $uri $uri/ =404;
        }
    
        location ~* \.(?:js|css|png|jpg|jpeg|svg|ico)$ {
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: modelado3d
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: modelado3d
spec:
  serviceName: mongo
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-replicaset
  namespace: modelado3d
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: initiate-replicaset
          image: mongo:7.0
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              for host in mongo-0.mongo.modelado3d.svc.cluster.local mongo-1.mongo.modelado3d.svc.cluster.local mongo-2.mongo.modelado3d.svc.cluster.local; do
                until mongosh --host "$host:27017" --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null; do
                  echo "Esperando $host..."
                  sleep 3
                done
              done
              mongosh --host mongo-0.mongo.modelado3d.svc.cluster.local:27017 --quiet --eval '
                let initialized = false;
                try { initialized = rs.status().ok === 1; } catch (e) {}
                if (!initialized) {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo.modelado3d.svc.cluster.local:27017", priority: 2 },
                      { _id: 1, host: "mongo-1.mongo.modelado3d.svc.cluster.local:27017", priority: 1 },
                      { _id: 2, host: "mongo-2.mongo.modelado3d.svc.cluster.local:27017", priority: 1 }
                    ]
                  });
                }
              '
              until mongosh --host mongo-0.mongo.modelado3d.svc.cluster.local:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
                echo "Esperando elección del primario rs0..."
                sleep 3
              done
              echo "Replica set rs0 inicializado."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelado3d-server
  namespace: modelado3d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelado3d-server
  template:
    metadata:
      labels:
        app: modelado3d-server
    spec:
      initContainers:
        - name: wait-for-mongodb-primary
          image: mongo:7.0
          command: ["/bin/bash", "-lc"]
          args:
            - |
              MONGO_SEEDS='mongodb://mongo-0.mongo.modelado3d.svc.cluster.local:27017,mongo-1.mongo.modelado3d.svc.cluster.local:27017,mongo-2.mongo.modelado3d.svc.cluster.local:27017/admin?replicaSet=rs0'
              until mongosh "$MONGO_SEEDS" --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do
                echo "Esperando a cualquier primario disponible en MongoDB replica set..."
                sleep 3
              done
      containers:
        - name: server
          image: modelado3d-server:2.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: modelado3d-config
          env:
            - name: AUTH_SECRET_FILE
              value: /var/run/secrets/modelado3d/auth-secret
          volumeMounts:
            - name: auth-secret
              mountPath: /var/run/secrets/modelado3d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: auth-secret
          secret:
            secretName: modelado3d-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: modelado3d-server
  namespace: modelado3d
spec:
  selector:
    app: modelado3d-server
  ports:
    - name: http-ws
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelado3d-client
  namespace: modelado3d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelado3d-client
  template:
    metadata:
      labels:
        app: modelado3d-client
    spec:
      containers:
        - name: client
          image: modelado3d-client:2.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: modelado3d-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: modelado3d-client
  namespace: modelado3d
spec:
  selector:
    app: modelado3d-client
  ports:
    - name: web
      port: 80
      targetPort: 80
